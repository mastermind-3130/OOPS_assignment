<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Audit log')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-4">Audit log</h1>

    <div class="table-responsive">
        <table class="table table-sm align-middle">
            <thead class="table-light">
            <tr>
                <th>Time</th><th>Actor</th><th>Action</th><th>Incident</th>
                <th>From</th><th>To</th><th>Details</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(entries)}">
                <td colspan="7" class="text-center text-muted py-3">No entries yet.</td>
            </tr>
            <tr th:each="a : ${entries}">
                <td class="small text-nowrap"
                    th:text="${#temporals.format(a.timestamp, 'dd MMM yyyy, HH:mm:ss')}">time</td>
                <td th:text="${a.actor}">actor</td>
                <td><code th:text="${a.action}">ACTION</code></td>
                <td>
                    <a th:if="${a.incidentId != null}"
                       th:href="@{/incidents/{id}(id=${a.incidentId})}"
                       th:text="${'#' + a.incidentId}">#1</a>
                </td>
                <td class="small" th:text="${a.previousState != null ? a.previousState : '-'}">-</td>
                <td class="small" th:text="${a.newState != null ? a.newState : '-'}">-</td>
                <td class="small" th:text="${a.description}">details</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
