<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <a th:href="@{/admin/dashboard}" class="small text-decoration-none">&larr; Back to dashboard</a>
    <h1 class="h3 mt-2 mb-4">All incidents</h1>

    <!-- The search feature can add its filter form here. -->

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr><th>ID</th><th>Title</th><th>Reporter</th><th>Service</th><th>Priority</th><th>Status</th><th>Technician</th><th>Reported</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(incidents)}">
                        <td colspan="8" class="text-center text-muted py-4">No incidents yet.</td>
                    </tr>
                    <tr th:each="i : ${incidents}">
                        <td class="fw-semibold"><a th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.reference}">INC0001</a></td>
                        <td th:text="${i.title}">Title</td>
                        <td th:text="${i.reporter.fullName}">Reporter</td>
                        <td th:text="${i.service != null ? i.service.name : '-'}">Service</td>
                        <td>
                            <span th:if="${i.priority != null}" class="badge"
                                  th:classappend="'priority-' + ${i.priority}"
                                  th:text="${i.priority.name() + ' ' + i.priority.label}">P1</span>
                            <span th:if="${i.priority == null}" class="text-muted small">Not set</span>
                        </td>
                        <td><span class="badge" th:classappend="'status-' + ${i.status}"
                                  th:text="${i.status.label}">New</span></td>
                        <td th:text="${i.assignedTechnician != null ? i.assignedTechnician.fullName : 'Unassigned'}">Technician</td>
                        <td class="small" th:text="${#temporals.format(i.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
