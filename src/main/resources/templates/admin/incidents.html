<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <a th:href="@{/admin/dashboard}" class="small text-decoration-none">&larr; Back to dashboard</a>
    <h1 class="h3 mt-2 mb-4">All incidents &amp; search</h1>

    <!-- Search filters -->
    <form th:action="@{/admin/incidents}" th:object="${criteria}" method="get" class="row g-2 mb-4">
        <div class="col-md-3">
            <input class="form-control" th:field="*{reference}" placeholder="Reference e.g. INC0003">
        </div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{status}">
                <option value="">Any status</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{priority}">
                <option value="">Any priority</option>
                <option th:each="p : ${priorities}" th:value="${p.name()}" th:text="${p.name() + ' ' + p.label}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{categoryId}">
                <option value="">Any category</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{serviceId}">
                <option value="">Any service</option>
                <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" th:field="*{technicianId}">
                <option value="">Any technician</option>
                <option th:each="t : ${technicians}" th:value="${t.id}" th:text="${t.fullName}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-0">Reported from</label>
            <input class="form-control" type="date" th:field="*{dateFrom}">
        </div>
        <div class="col-md-3">
            <label class="form-label small mb-0">Reported to</label>
            <input class="form-control" type="date" th:field="*{dateTo}">
        </div>
        <div class="col-md-3 d-flex align-items-center">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="slaBreached" name="slaBreached" value="true"
                       th:checked="${criteria.slaBreached == true}">
                <label class="form-check-label" for="slaBreached">SLA breached</label>
            </div>
        </div>
        <div class="col-md-9 d-flex align-items-center gap-2">
            <button type="submit" class="btn btn-primary">Search</button>
            <a th:href="@{/admin/incidents}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr><th>ID</th><th>Title</th><th>Reporter</th><th>Service</th><th>Priority</th><th>Status</th><th>Technician</th><th>Reported</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(incidents)}">
                        <td colspan="8" class="text-center text-muted py-4">No incidents found.</td>
                    </tr>
                    <tr th:each="i : ${incidents}">
                        <td class="fw-semibold"><a th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.reference}">INC0001</a></td>
                        <td th:text="${i.title}">Title</td>
                        <td th:text="${i.reporter.fullName}">Reporter</td>
                        <td th:text="${i.service != null ? i.service.name : '-'}">Service</td>
                        <td>
                            <span th:if="${i.priority != null}" class="badge"
                                  th:classappend="'priority-' + ${i.priority}"
                                  th:text="${i.priority.name() + ' ' + i.priority.label}">P1</span>
                            <span th:if="${i.priority == null}" class="text-muted small">Not set</span>
                        </td>
                        <td><span class="badge" th:classappend="'status-' + ${i.status}"
                                  th:text="${i.status.label}">New</span></td>
                        <td th:text="${i.assignedTechnician != null ? i.assignedTechnician.fullName : 'Unassigned'}">Technician</td>
                        <td class="small" th:text="${#temporals.format(i.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
