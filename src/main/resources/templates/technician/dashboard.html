<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My work')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h1 class="h3 mb-1">My assigned incidents</h1>
    <p class="text-muted mb-4">
        Skills:
        <span th:each="s : ${technician.skills}" class="badge text-bg-light border me-1" th:text="${s}">SKILL</span>
    </p>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Active workload</div>
                <div class="stat-value">
                    <span th:text="${activeCount}">0</span>
                    <span class="fs-6 text-muted" th:text="'/ ' + ${technician.maxActiveIncidents}">/ 5</span>
                </div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Total assigned</div>
                <div class="stat-value" th:text="${#lists.size(incidents)}">0</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Availability</div>
                <div class="stat-value fs-5" th:text="${technician.available} ? 'Available' : 'Unavailable'">Available</div>
            </div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr><th>ID</th><th>Title</th><th>Reporter</th><th>Priority</th><th>Status</th><th>Resolve by</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(incidents)}">
                        <td colspan="6" class="text-center text-muted py-4">No incidents assigned to you yet.</td>
                    </tr>
                    <tr th:each="i : ${incidents}">
                        <td class="fw-semibold"><a th:href="@{/incidents/{id}(id=${i.id})}" th:text="${i.reference}">INC0001</a></td>
                        <td th:text="${i.title}">Title</td>
                        <td th:text="${i.reporter.fullName}">Reporter</td>
                        <td>
                            <span th:if="${i.priority != null}" class="badge"
                                  th:classappend="'priority-' + ${i.priority}"
                                  th:text="${i.priority.name() + ' ' + i.priority.label}">P1</span>
                            <span th:if="${i.priority == null}" class="text-muted small">Not set</span>
                        </td>
                        <td><span class="badge" th:classappend="'status-' + ${i.status}"
                                  th:text="${i.status.label}">New</span></td>
                        <td class="small"
                            th:text="${i.resolutionDeadline != null ? #temporals.format(i.resolutionDeadline, 'dd MMM, HH:mm') : '-'}">-</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
