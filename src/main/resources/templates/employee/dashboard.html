<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My incidents')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-0">My incidents</h1>
            <p class="text-muted mb-0">Report problems and track their progress.</p>
        </div>
        <!-- TODO (incident feature): point this to the report form, e.g. /employee/incidents/new -->
        <a href="#" class="btn btn-primary disabled" aria-disabled="true">Report an incident</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Total reported</div>
                <div class="stat-value" th:text="${#lists.size(incidents)}">0</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Open</div>
                <div class="stat-value" th:text="${openCount}">0</div>
            </div></div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card"><div class="card-body">
                <div class="stat-label">Resolved / closed</div>
                <div class="stat-value" th:text="${resolvedCount}">0</div>
            </div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr><th>ID</th><th>Title</th><th>Service</th><th>Priority</th><th>Status</th><th>Reported</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(incidents)}">
                        <td colspan="6" class="text-center text-muted py-4">You have not reported any incidents yet.</td>
                    </tr>
                    <tr th:each="i : ${incidents}">
                        <td class="fw-semibold" th:text="${i.reference}">INC0001</td>
                        <td th:text="${i.title}">Title</td>
                        <td th:text="${i.service != null ? i.service.name : '-'}">Service</td>
                        <td>
                            <span th:if="${i.priority != null}" class="badge"
                                  th:classappend="'priority-' + ${i.priority}"
                                  th:text="${i.priority.name() + ' ' + i.priority.label}">P1</span>
                            <span th:if="${i.priority == null}" class="text-muted small">Not set</span>
                        </td>
                        <td><span class="badge" th:classappend="'status-' + ${i.status}"
                                  th:text="${i.status.label}">New</span></td>
                        <td class="small" th:text="${#temporals.format(i.createdAt, 'dd MMM yyyy, HH:mm')}">date</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
