<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Shared pieces used by every page. -->

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | I-ITSM'">I-ITSM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">I-ITSM</a>
        <div class="d-flex align-items-center gap-3" th:if="${currentUser != null}">
            <span class="navbar-text text-light small">
                <span th:text="${currentUser.fullName}">Name</span>
                <span class="badge text-bg-secondary ms-1" th:text="${currentUser.role}">ROLE</span>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
