<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<div class="container" style="max-width: 480px;">
    <h2 class="my-4">Create an account</h2>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" th:field="*{username}">
            <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Full name</label>
            <input class="form-control" th:field="*{fullName}">
            <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="email" th:field="*{email}">
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Department</label>
            <input class="form-control" th:field="*{department}">
        </div>
        <div class="mb-3">
            <label class="form-label">Password (min 8 characters)</label>
            <input class="form-control" type="password" th:field="*{password}">
            <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Register</button>
        <p class="mt-3 text-center"><a th:href="@{/login}">Back to login</a></p>
    </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
