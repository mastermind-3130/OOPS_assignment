<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <h1 class="h3 text-center mb-1">I-ITSM</h1>
            <p class="text-center text-muted mb-4">IT Service Management &amp; Incident Resolution</p>

            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div th:if="${param.error}" class="alert alert-danger">Wrong username or password.</div>
                    <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Log in</button>
                    </form>
                </div>
            </div>

            <!-- Remove this box before the final submission if you prefer. -->
            <div class="card mt-3">
                <div class="card-body small">
                    <strong>Demo accounts</strong> (password: <code>password123</code>)
                    <table class="table table-sm mb-0 mt-2">
                        <tr><td>Admin</td><td><code>admin</code></td></tr>
                        <tr><td>Employees</td><td><code>emp1</code>, <code>emp2</code></td></tr>
                        <tr><td>Technicians</td><td><code>tech1</code>, <code>tech2</code>, <code>tech3</code></td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
